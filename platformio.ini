[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[env:xye_queries]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DHVAC_XYE_QUERIES=1

[env:proxy_bench]
extends = env:xye_queries
build_flags = ${env:xye_queries.build_flags} -DHVAC_PROXY_BENCH=1
